name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  posekit:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: PoseKit tests
        run: swift test --package-path PoseKit
  posekit-kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Kotlin PoseKit tests + Android app tests + build
        run: gradle -p android :posekit:test :app:testDebugUnitTest :app:assembleDebug
  app:
    # Matches release.yml: build against the same toolchain that ships, so an
    # SDK-related compile break surfaces on a PR rather than at upload.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          set -euo pipefail
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          echo "DEVELOPER_DIR=$NEWEST/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen
      - name: Build + test on simulator
        shell: bash
        run: |
          set -o pipefail
          # Pick whatever iPhone simulator this Xcode actually ships rather than
          # pinning a model name that a future runner image may drop.
          DEVICE=$(xcrun simctl list devices available \
            | grep -oE 'iPhone [0-9]+( Pro)?( Max)?' | sort -V | tail -1)
          echo "Simulator: $DEVICE"
          xcodebuild test -project Pose.xcodeproj -scheme Pose \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO | tail -300
