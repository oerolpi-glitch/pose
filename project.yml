name: Pose
options:
  bundleIdPrefix: com.oerol
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  SuperwallKit:
    url: https://github.com/superwall/Superwall-iOS
    from: 4.0.0
  PoseKit:
    path: PoseKit
targets:
  Pose:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Resources"]
      - path: App/Resources/Poses
        type: folder
        buildPhase: resources
    dependencies:
      - package: SuperwallKit
        product: SuperwallKit
      - package: PoseKit
        product: PoseKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oerol.pose
        INFOPLIST_FILE: App/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # Without this, automatic signing defaults CODE_SIGN_IDENTITY to
        # "Apple Development" and `xcodebuild archive` asks Apple for a
        # DEVELOPMENT profile — which requires a registered device and fails on
        # CI with "Your team has no devices from which to generate a
        # provisioning profile". App Store distribution profiles need no
        # devices, so naming the identity is what routes -allowProvisioningUpdates
        # to the right kind of profile.
        # Scoped to iphoneos so simulator test builds (ci.yml, unsigned) are
        # unaffected.
        Release:
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Distribution"
    scheme:
      testTargets:
        - PoseTests
  PoseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
    dependencies:
      - target: Pose
